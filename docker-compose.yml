services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agripulse
      POSTGRES_PASSWORD: agripulse
      POSTGRES_DB: agripulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agripulse"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://agripulse:agripulse@db:5432/agripulse
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
